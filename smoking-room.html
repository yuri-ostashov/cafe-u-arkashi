<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Курилка — Кафе у Аркаши</title>

    <style>
        body {
            margin: 0;
            background-color: #4a4038;
            color: #f5eadb;
            font-family: Arial, sans-serif;
        }

        header {
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: #f3c98b;
        }

        nav a {
            color: #ffd9a0;
            text-decoration: none;
        }

        .smoking-room {
            background-color: #2f2925;
            width: 90%;
            max-width: 650px;
            box-sizing: border-box;

            padding: 25px;
            margin: 30px auto;

            border: 2px solid #8b6b4a;
            border-radius: 15px;

            box-shadow: 0 5px 15px #222;
        }

        .login-box,
        .user-bar,
        .people-box {
            background-color: #3b342f;

            padding: 15px;
            margin: 20px 0;

            border-radius: 8px;
        }

        .login-box input {
            width: 60%;
            box-sizing: border-box;
            padding: 10px;
        }

        .login-box button {
            padding: 10px 15px;
            cursor: pointer;
        }

        .user-bar {
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .user-bar.visible {
            display: flex;
        }

        .user-name {
            font-weight: bold;
            color: #f3c98b;
        }

        .change-user-button {
            padding: 8px 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .chat-messages {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }

        .message-row {
            display: flex;
            width: 100%;
        }

        .message-row.own {
            justify-content: flex-end;
        }

        .message-row.other {
            justify-content: flex-start;
        }

        .message-bubble {
            max-width: 78%;
            padding: 10px 12px;

            border-radius: 14px;
            box-sizing: border-box;

            word-wrap: break-word;
        }

        .message-row.other .message-bubble {
            background-color: #3b342f;
            border-bottom-left-radius: 4px;
        }

        .message-row.own .message-bubble {
            background-color: #6f5338;
            border-bottom-right-radius: 4px;
        }

        .message-author {
            color: #f3c98b;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .message-text {
            font-size: 16px;
            line-height: 1.35;
        }

        .message-time {
            margin-top: 5px;
            font-size: 11px;
            opacity: 0.7;
            text-align: right;
        }

        .chat-box {
            display: flex;
            align-items: center;
            gap: 8px;

            background-color: #3b342f;

            padding: 10px;
            margin: 20px 0 8px 0;

            border-radius: 25px;
        }

        .chat-box input {
            flex: 1;

            width: auto;
            min-width: 0;

            padding: 12px 15px;

            border: none;
            border-radius: 20px;

            outline: none;

            font-size: 16px;
        }

        .chat-icon,
        .send-button {
            width: 42px;
            height: 42px;

            flex-shrink: 0;

            padding: 0;

            border: none;
            border-radius: 50%;

            cursor: pointer;

            font-size: 20px;
        }

        .send-button {
            font-size: 22px;
        }

        .emoji-panel {
            display: none;

            flex-wrap: wrap;
            gap: 8px;

            background-color: #3b342f;

            padding: 12px;
            margin-bottom: 20px;

            border-radius: 12px;
        }

        .emoji-panel.open {
            display: flex;
        }

        .emoji-button {
            width: 40px;
            height: 40px;

            border: none;
            border-radius: 10px;

            cursor: pointer;

            font-size: 22px;
        }

        @media (max-width: 600px) {

            header {
                padding: 10px;
            }

            nav {
                line-height: 2;
            }

            .smoking-room {
                width: auto;

                margin: 15px 10px;
                padding: 15px;
            }

            .login-box input {
                width: 100%;
                margin-bottom: 10px;
            }

            .login-box button {
                width: 100%;
            }

            .user-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .change-user-button {
                width: 100%;
            }

            .message-bubble {
                max-width: 86%;
            }

            .chat-box {
                gap: 6px;
                padding: 8px;
            }

            .chat-icon,
            .send-button {
                width: 40px;
                height: 40px;
            }

            .emoji-panel {
                gap: 6px;
            }

            .emoji-button {
                width: 38px;
                height: 38px;
                font-size: 21px;
            }
        }

    </style>
</head>


<body>

    <header>

        <h1>Курилка</h1>

        <p>
            Здесь можно присесть, поговорить и поделиться своими историями.
        </p>

        <nav>
            <a href="index.html">Главная</a> |
            <a href="recipes.html">Рецепты</a> |
            <a href="#">Советы</a> |
            <a href="#">Курилка</a>
        </nav>

    </header>


    <div class="smoking-room">

        <h2>Разговоры без галстуков</h2>


        <div id="login-box" class="login-box">

            <h3>Зайти в Курилку</h3>

            <input
                type="text"
                id="username"
                placeholder="Введите имя или ник"
            >

            <button id="login-button">
                Войти
            </button>

            <p id="welcome"></p>

        </div>


        <div id="user-bar" class="user-bar">

            <div>
                Вы вошли как
                <span id="current-user-name" class="user-name"></span>
            </div>

            <button
                id="change-user-button"
                class="change-user-button"
                type="button"
            >
                Сменить имя
            </button>

        </div>


        <div
            id="chat-messages"
            class="chat-messages"
        ></div>


        <div class="chat-box">

            <button
                id="emoji-toggle"
                class="chat-icon"
                type="button"
                title="Эмодзи"
            >
                🙂
            </button>

            <button
                class="chat-icon"
                type="button"
                title="Прикрепить файл"
            >
                📎
            </button>

            <input
                type="text"
                id="message"
                placeholder="Написать сообщение..."
            >

            <button
                id="send-button"
                class="send-button"
                type="button"
                title="Отправить"
            >
                ➤
            </button>

        </div>


        <div
            id="emoji-panel"
            class="emoji-panel"
        >

            <button class="emoji-button" type="button">😀</button>
            <button class="emoji-button" type="button">😄</button>
            <button class="emoji-button" type="button">😂</button>
            <button class="emoji-button" type="button">😉</button>
            <button class="emoji-button" type="button">😎</button>
            <button class="emoji-button" type="button">🤔</button>
            <button class="emoji-button" type="button">😡</button>

            <button class="emoji-button" type="button">👍</button>
            <button class="emoji-button" type="button">👎</button>
            <button class="emoji-button" type="button">🤝</button>

            <button class="emoji-button" type="button">❤️</button>
            <button class="emoji-button" type="button">🔥</button>

            <button class="emoji-button" type="button">☕</button>
            <button class="emoji-button" type="button">🍾</button>
            <button class="emoji-button" type="button">🥂</button>
            <button class="emoji-button" type="button">🚬</button>

        </div>


        <div class="people-box">

            <h3>Сейчас в Курилке</h3>

            <ul id="people-list">
                <li>Аркаша</li>
                <li>Анжела</li>
            </ul>

        </div>

    </div>


    <script type="module">

        import { initializeApp }
        from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


        import {
            getDatabase,
            ref,
            push,
            onChildAdded,
            serverTimestamp
        }
        from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


        const firebaseConfig = {

            apiKey:
                "AIzaSyB60yxDm_FgW7JmeYAAr1covhkFaGk8-k8",

            authDomain:
                "cafe-u-arkashi.firebaseapp.com",

            databaseURL:
                "https://cafe-u-arkashi-default-rtdb.europe-west1.firebasedatabase.app",

            projectId:
                "cafe-u-arkashi",

            storageBucket:
                "cafe-u-arkashi.firebasestorage.app",

            messagingSenderId:
                "589764953441",

            appId:
                "1:589764953441:web:08ef627e7ef399e13b3120"
        };


        const app =
            initializeApp(firebaseConfig);


        const database =
            getDatabase(app);


        const messagesRef =
            ref(database, "messages");


        let currentUser =
            localStorage.getItem("smokingRoomUser") || "";


        function updateUserInterface() {

            const loginBox =
                document.getElementById("login-box");


            const userBar =
                document.getElementById("user-bar");


            const currentUserName =
                document.getElementById("current-user-name");


            if (currentUser !== "") {

                loginBox.style.display =
                    "none";


                userBar.classList.add(
                    "visible"
                );


                currentUserName.textContent =
                    currentUser;

            } else {

                loginBox.style.display =
                    "block";


                userBar.classList.remove(
                    "visible"
                );


                currentUserName.textContent =
                    "";
            }
        }


        function enterSmokingRoom() {

            const name =
                document
                    .getElementById("username")
                    .value
                    .trim();


            if (name === "") {

                document
                    .getElementById("welcome")
                    .textContent =
                    "Сначала представьтесь.";

                return;
            }


            currentUser =
                name;


            localStorage.setItem(
                "smokingRoomUser",
                name
            );


            addPersonToList(
                name
            );


            updateUserInterface();
        }


        function changeUser() {

            localStorage.removeItem(
                "smokingRoomUser"
            );


            currentUser =
                "";


            document
                .getElementById("username")
                .value =
                "";


            document
                .getElementById("welcome")
                .textContent =
                "";


            updateUserInterface();


            document
                .getElementById("username")
                .focus();
        }


        function addPersonToList(name) {

            const peopleList =
                document.getElementById("people-list");


            const people =
                peopleList.getElementsByTagName("li");


            for (const person of people) {

                if (person.textContent === name) {
                    return;
                }
            }


            const newPerson =
                document.createElement("li");


            newPerson.textContent =
                name;


            peopleList.appendChild(
                newPerson
            );
        }


        async function sendMessage() {

            const message =
                document
                    .getElementById("message")
                    .value
                    .trim();


            if (currentUser === "") {

                alert(
                    "Сначала зайдите в Курилку."
                );

                return;
            }


            if (message === "") {

                alert(
                    "Напишите сообщение."
                );

                return;
            }


            try {

                await push(
                    messagesRef,
                    {
                        author: currentUser,
                        text: message,
                        time: serverTimestamp()
                    }
                );


                document
                    .getElementById("message")
                    .value =
                    "";

            } catch (error) {

                console.error(error);


                alert(
                    "Не удалось отправить сообщение."
                );
            }
        }


        function formatTime(timestamp) {

            if (!timestamp) {
                return "";
            }


            const date =
                new Date(timestamp);


            return date.toLocaleTimeString(
                "ru-RU",
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );
        }


        function showMessage(
            author,
            text,
            time
        ) {

            const row =
                document.createElement("div");


            const isOwn =
                author === currentUser;


            row.className =
                "message-row "
                + (
                    isOwn
                        ? "own"
                        : "other"
                );


            const bubble =
                document.createElement("div");


            bubble.className =
                "message-bubble";


            const authorLine =
                document.createElement("div");


            authorLine.className =
                "message-author";


            authorLine.textContent =
                author;


            const messageLine =
                document.createElement("div");


            messageLine.className =
                "message-text";


            messageLine.textContent =
                text;


            const timeLine =
                document.createElement("div");


            timeLine.className =
                "message-time";


            timeLine.textContent =
                formatTime(time);


            bubble.appendChild(
                authorLine
            );


            bubble.appendChild(
                messageLine
            );


            bubble.appendChild(
                timeLine
            );


            row.appendChild(
                bubble
            );


            document
                .getElementById("chat-messages")
                .appendChild(row);
        }


        function toggleEmojiPanel() {

            document
                .getElementById("emoji-panel")
                .classList
                .toggle("open");
        }


        function insertEmoji(emoji) {

            const messageInput =
                document.getElementById("message");


            const start =
                messageInput.selectionStart;


            const end =
                messageInput.selectionEnd;


            const before =
                messageInput.value.substring(
                    0,
                    start
                );


            const after =
                messageInput.value.substring(
                    end
                );


            messageInput.value =
                before
                + emoji
                + after;


            const newPosition =
                start
                + emoji.length;


            messageInput.focus();


            messageInput.setSelectionRange(
                newPosition,
                newPosition
            );
        }


        onChildAdded(
            messagesRef,

            function(snapshot) {

                const message =
                    snapshot.val();


                if (!message) {
                    return;
                }


                showMessage(
                    message.author,
                    message.text,
                    message.time
                );
            }
        );


        function loadSmokingRoom() {

            if (currentUser !== "") {

                document
                    .getElementById("username")
                    .value =
                    currentUser;


                addPersonToList(
                    currentUser
                );
            }


            updateUserInterface();


            showMessage(
                "Аркаша",
                "Ну что, кто первый зашёл в Курилку?",
                null
            );


            showMessage(
                "Анжела",
                "Я только на минутку. У меня кофе убежит.",
                null
            );
        }


        document
            .getElementById("login-button")
            .addEventListener(
                "click",
                enterSmokingRoom
            );


        document
            .getElementById("change-user-button")
            .addEventListener(
                "click",
                changeUser
            );


        document
            .getElementById("send-button")
            .addEventListener(
                "click",
                sendMessage
            );


        document
            .getElementById("emoji-toggle")
            .addEventListener(
                "click",
                toggleEmojiPanel
            );


        document
            .querySelectorAll(".emoji-button")
            .forEach(
                function(button) {

                    button.addEventListener(
                        "click",

                        function() {

                            insertEmoji(
                                button.textContent
                            );
                        }
                    );
                }
            );


        document
            .getElementById("message")
            .addEventListener(
                "keydown",

                function(event) {

                    if (event.key === "Enter") {
                        sendMessage();
                    }
                }
            );


        loadSmokingRoom();

    </script>

</body>

</html>
